<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <title>Shaft README hero</title>
  <desc>Shaft logo with a restrained technical overview for multimodal training and inference.</desc>
  <rect width="1200" height="320" rx="16" fill="#0D0F12"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" stroke="#252A32"/>

  <g stroke="#1B2027" stroke-width="1">
    <path d="M40 0V320M80 0V320M120 0V320M160 0V320M200 0V320M240 0V320M280 0V320"/>
    <path d="M0 40H320M0 80H320M0 120H320M0 160H320M0 200H320M0 240H320M0 280H320"/>
  </g>

  <!-- Mark geometry is derived from shaft-mark.svg, the single source of truth. -->
  <svg x="58" y="46" width="204" height="228" viewBox="0 0 24 24">
