        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="58" font-weight="700" letter-spacing="8">SHAFT</text>
  <text x="380" y="160" fill="#AEB4BF"
        font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="15" font-weight="600" letter-spacing="2">HF-FIRST MULTIMODAL TRAINING &amp; INFERENCE</text>

  <line x1="376" y1="202" x2="1124" y2="202" stroke="#303640"/>
  <line x1="376" y1="198" x2="376" y2="206" stroke="#69717E"/>
  <line x1="563" y1="198" x2="563" y2="206" stroke="#69717E"/>
  <line x1="750" y1="198" x2="750" y2="206" stroke="#69717E"/>
  <line x1="937" y1="198" x2="937" y2="206" stroke="#69717E"/>
  <line x1="1124" y1="198" x2="1124" y2="206" stroke="#69717E"/>

  <g fill="#F7F8FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
