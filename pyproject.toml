[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaft"
version = "0.1.0"
description = "Shaft: a pragmatic multimodal SFT/RL backbone framework."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "numpy==2.2.6",
  "packaging>=24.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "safetensors>=0.5.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "tqdm>=4.66",
  "transformers>=5.10.1,<6",
  "peft>=0.18.1",
  "wandb>=0.19.0",
  "openai>=2.30.0",
  "matplotlib>=3.10.8",
  "modelscope>=1.35.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "ruff>=0.9.0",
  "pytest>=8.0.0",
]
train = [
  "accelerate>=1.7.0",
  "datasets>=3.0.0",
]
gpu = [
  "bitsandbytes>=0.46.1",
]
gpu-kernels = [
  "flash-attn==2.8.3",
  "flash-linear-attention>=0.5.0",
  "causal-conv1d>=1.6.2",
]
rlhf = [
  "trl>=1.9.2,<2.0.0",
  "accelerate>=1.7.0",
  "datasets>=4.7.0",
]
serve = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "vllm==0.19.1; sys_platform == 'linux'",
]
qwen-next = [
  "transformers==5.10.1",
]
distributed = [
  "deepspeed>=0.16.0; sys_platform == 'linux'",
  "ninja>=1.11.0; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "ninja",
  "packaging",
  "psutil",
]
causal-conv1d = [
  { requirement = "torch", match-runtime = true },
  "ninja",
  "packaging",
]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_FORCE_BUILD = "TRUE" }
causal-conv1d = { CAUSAL_CONV1D_FORCE_BUILD = "TRUE" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
norecursedirs = [
  "old",
  "temp",
  "build",
  "outputs",
  "wandb",
  "rex-omni-test",
]
markers = [
  "unit: pure module-level checks with no filesystem, subprocess, model service, or heavyweight framework setup.",
  "component: checks one Shaft component through its public API using in-memory fakes or tmp_path fixtures.",
  "contract: verifies a stable CLI/API/schema contract rather than private implementation details.",
  "slow: tests that are valid but too slow for the default developer/PR loop.",
  "gpu: tests that require CUDA/NPU/MPS or GPU-oriented runtime assumptions.",
  "task: tests for temporary data/review/task scripts rather than the maintained Shaft framework contract.",
  "visual: tests for review visualization/rendering artifacts rather than training framework behavior.",
  "perf: performance guard tests that are not deterministic enough for default CI.",
  "smoke: runs a shortest viable cross-component path and is excluded from default pytest.",
  "integration: marks tests that run integration workflow (model loading / real inference).",
  "manual: marks tests that should be executed manually only.",
]
