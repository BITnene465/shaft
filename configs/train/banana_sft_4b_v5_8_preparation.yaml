# Banana v5.8 configuration-only preparation recipe.
#
# This file freezes the PromptSource pool/source contract before any v5.8 SFT data is built.
# Referenced formulation JSONL files are future materialized outputs; this recipe must not be used
# as a production training config until every source exists and the v5.8 data audits pass.
# Formulations use static weighted categorical sampling; PromptSource has no curriculum schema.
experiment:
  name: banana-v5.8-preparation-qwen3vl-sft-4b
  output_dir: outputs/qwen3vl-sft/4b/banana-v5.8-preparation
  seed: 42

model:
  model_type: qwen3vl
  model_name_or_path: models/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16
  finetune:
    mode: full
    target_modules: ["auto"]
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.0
    lora_bias: none
    use_rslora: false
    qlora_load_in_4bit: true
    qlora_use_double_quant: true
    qlora_quant_type: nf4
    qlora_compute_dtype: bfloat16

algorithm:
  name: sft
  params: {}

data:
  batching:
    grouping: bounded_cost
    cardinality: token_budget
    packing:
      mode: none
    layout: padded
    buffer_size: 64
    cost_cache_size: 65536
    max_tokens_per_microbatch: 10000
    resource_budgets:
      vision_patches: 16384
  catalog_path: ../data/banana_v5_8.yaml
  catalog_names:
    - grounding_layout
    - background
    - shape_context_reconstruction
    - line_context_reconstruction
    - line_context_points
    - image_context_reconstruction
  prompt_sources:
    grounding_layout:
      path: ../prompts/pools/grounding_layout.v5.8.yaml
      apply_to: train
    background:
      path: ../prompts/pools/background.v5.8.yaml
      apply_to: train
    shape_context_reconstruction:
      path: ../prompts/pools/shape_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        appearance:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/appearance/train.jsonl
        geometry:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/geometry/train.jsonl
        reconstruction:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/reconstruction/train.jsonl
    line_context_reconstruction:
      path: ../prompts/pools/line_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        appearance:
          train_path: ../../data/line_context_reconstruction/sft/formulations/appearance/train.jsonl
        points:
          train_path: ../../data/line_context_reconstruction/sft/formulations/points/train.jsonl
        reconstruction:
          train_path: ../../data/line_context_reconstruction/sft/formulations/reconstruction/train.jsonl
    line_context_points:
      path: ../prompts/pools/line_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        points:
          train_path: ../../data/line_context_points/sft/formulations/points/train.jsonl

    image_context_reconstruction:
      path: ../prompts/pools/image_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        image_type:
          train_path: ../../data/image_context_reconstruction/sft/formulations/image_type/train.jsonl

  schedule:
    mixing: weighted
    shuffle: true
  media_snapshot_id: banana-v5.8-v9-20260802-reviewed-real-v1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  min_pixels: 500000
  max_pixels: 2000000
  max_length: 10000
  add_eos_token: true

train:
  duration:
    unit: steps
    value: 14000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 0.00002
  param_group_lrs:
    vision_tower: 0.00001
    aligner: 0.00002
  no_decay_name_patterns:
    - embed_tokens.weight
  optimizer_name: adamw_torch
  scheduler_name: auto
  scheduler_num_cycles: 0.5
  scheduler_power: 1.0
  loss_name: auto
  loss_scale: default
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.001
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  logging_steps: 50
  save_strategy: steps
  save_epoch_interval: 1
  save_steps: 2000
  save_total_limit: 6
  load_best_model_at_end: false
  save_final_model: true
  save_final_state: true
  ddp_find_unused_parameters: false
  report_to: ["wandb"]
  init_from_checkpoint:
  resume_from_checkpoint:

eval:
  enabled: false
  per_device_eval_batch_size: 1
  eval_strategy: no
  epoch_interval: 1
  eval_steps: 200
  loss_metrics_enabled: false
  do_sample: false
  temperature: 0.0
  max_new_tokens: 8000
  online_metrics_enabled: false
  metric_for_best_model: eval_loss
  greater_is_better: false
  datasets: {}

plugins:
  hooks: []

logging:
  level: INFO
  fmt: text
  file_path:
  rank_zero_only: true

progress:
  enabled: true
  display: auto
  width: 72
  refresh_interval: 0.5
  log_interval: 30.0
  leave_completed: false
  persist: true
