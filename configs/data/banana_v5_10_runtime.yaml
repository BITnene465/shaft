# Data configuration fragment, NOT a standalone training command.
# Merge into the chosen training config after model/optimization alignment.
# Paths below are relative to this file (also valid from configs/train/).
experiment:
  seed: 465
eval:
  enabled: false
data:
  catalog_path: ../data/banana_v5_10.yaml
  catalog_names:
    - grounding_layout
    - shape_context_reconstruction
    - shape_context_reconstruction_real
    - line_context_reconstruction
    - line_context_points
    - image_context_reconstruction
    - background
  schedule:
    mixing: weighted
    shuffle: true
  media_snapshot_id: banana-v5.10-v10-20260830-real-shape-grounding-v1
  prompt_sources:
    grounding_layout:
      path: ../prompts/pools/grounding_layout.v5.8.yaml
      apply_to: train
    shape_context_reconstruction:
      path: ../prompts/pools/shape_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        appearance:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/appearance/train.jsonl
        geometry:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/geometry/train.jsonl
        reconstruction:
          train_path: ../../data/shape_context_reconstruction/sft/formulations/reconstruction/train.jsonl
    shape_context_reconstruction_real:
      path: ../prompts/pools/shape_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        appearance:
          train_path: ../../data/shape_context_reconstruction_real/sft/formulations/appearance/train.jsonl
        geometry:
          train_path: ../../data/shape_context_reconstruction_real/sft/formulations/geometry/train.jsonl
        reconstruction:
          train_path: ../../data/shape_context_reconstruction_real/sft/formulations/reconstruction/train.jsonl
    line_context_reconstruction:
      path: ../prompts/pools/line_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        appearance:
          train_path: ../../data/line_context_reconstruction/sft/formulations/appearance/train.jsonl
        points:
          train_path: ../../data/line_context_reconstruction/sft/formulations/points/train.jsonl
        reconstruction:
          train_path: ../../data/line_context_reconstruction/sft/formulations/reconstruction/train.jsonl
    line_context_points:
      path: ../prompts/pools/line_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        points:
          train_path: ../../data/line_context_points/sft/formulations/points/train.jsonl
    image_context_reconstruction:
      path: ../prompts/pools/image_context_reconstruction.v5.8.yaml
      apply_to: train
      formulation_sources:
        image_type:
          train_path: ../../data/image_context_reconstruction/sft/formulations/image_type/train.jsonl
    background:
      path: ../prompts/pools/background.v5.8.yaml
      apply_to: train
