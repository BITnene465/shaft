metadata:
  id: shaft.line_context_points.formulation_pool.v5.8
  version: v5.8
  name: v5.8 ordered real and synthetic line-path formulations
  task: line_context_points
  subtask: line_context_points
  target_labels: [line]

arguments:
  proposal_bbox_2d:
    type: bbox_2d_0_999

formulations:
  - id: topology
    sampling_weight: 1.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: &banana_v5_8_system >-
          You are a specialized model for editable visual layout understanding and
          reconstruction. Return exactly one compact valid JSON value that follows the requested
          task schema. Do not output Markdown, code fences, comments, explanations, or unrequested
          fields. When coordinates are requested, use integers from 0 to 999 relative to the
          entire current input image. A provided proposal bbox identifies the intended target
          only; it is not ground-truth geometry and does not define a separate coordinate frame.
        user_prompt_template: |
          Determine only the path topology of the visible line or arrow near approximate proposal
          bbox {{ proposal_bbox_2d | json }}. Ignore nearby objects and independent lines.

          Return exactly:
          {"type":"line","parameters":{"is_single":true|false}}

          Use true for exactly one ordered path segment, including a polyline with several bends.
          Use false only for one connected branched target represented by multiple path segments.
          Output no points or appearance fields.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Classify the path topology of the target line near
          {{ proposal_bbox_2d | json }}.

  - id: geometry
    sampling_weight: 1.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: |
          Trace only the visible center-path geometry of the line or arrow near approximate
          proposal bbox {{ proposal_bbox_2d | json }}. Follow the target rather than the proposal
          and ignore nearby objects and independent lines.

          Return exactly:
          {"type":"line","parameters":{"points":[[[x1,y1],[x2,y2],...]]}}

          points is a list of ordered path segments. Straight paths preserve endpoints and actual
          bends; rounded bends use one point at the visible arc midpoint; curved segments contain
          exactly start, one-third, two-thirds, and end. Preserve every connected branch as a
          separate segment and order a one-way path from tail to arrowhead. Output no is_single or
          appearance fields.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Trace the target line near {{ proposal_bbox_2d | json }} as ordered points.

  - id: path
    sampling_weight: 1.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: |
          Recover the complete visible center path of the line or arrow near approximate proposal
          bbox {{ proposal_bbox_2d | json }}. Follow the target rather than the proposal and ignore
          nearby objects and independent lines.

          Return exactly:
          {"type":"line","parameters":{"is_single":true|false,"points":[[[x1,y1],[x2,y2],...]]}}

          One segment means is_single true; multiple connected branch segments mean false.
          Straight paths preserve endpoints and actual bends; rounded bends use the visible arc
          midpoint; curved segments contain exactly four ordered points. Preserve every visible
          branch and order a one-way path from tail to arrowhead. Output no appearance fields.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Recover the standard ordered path of the target line near
          {{ proposal_bbox_2d | json }}.
