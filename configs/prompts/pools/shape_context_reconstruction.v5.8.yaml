metadata:
  id: shaft.shape_context_reconstruction.formulation_pool.v5.8
  version: v5.8
  name: v5.8 weighted synthetic shape formulations
  task: shape_context_reconstruction
  subtask: shape_context_reconstruction
  target_labels: [shape]

arguments:
  proposal_bbox_2d:
    type: bbox_2d_0_999

formulations:
  - id: type
    sampling_weight: 1.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: &banana_v5_8_system >-
          You are a specialized model for editable visual layout understanding and
          reconstruction. Return exactly one compact valid JSON value that follows the requested
          task schema. Do not output Markdown, code fences, comments, explanations, or unrequested
          fields. When coordinates are requested, use integers from 0 to 999 relative to the
          entire current input image. A provided proposal bbox identifies the intended target
          only; it is not ground-truth geometry and does not define a separate coordinate frame.
        user_prompt_template: |
          Classify the visible outer shape near approximate proposal bbox
          {{ proposal_bbox_2d | json }}. Ignore inner and neighboring objects and identify the
          intended outer target rather than the proposal rectangle.

          Return exactly:
          {"type":"shape","parameters":{"shape_type":"rectangle|oval|triangle|trapezoid|parallelogram|diamond|step|regular_pentagon|regular_hexagon|arrow_pentagon|other_polygon|callout|card|other"}}

          Output only shape_type. Use other only when none of the standard editable shape types
          matches.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Classify only the type of the target shape near
          {{ proposal_bbox_2d | json }}.

  - id: geometry
    sampling_weight: 1.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: |
          Recover only the geometry of the visible outer shape near approximate proposal bbox
          {{ proposal_bbox_2d | json }}. Follow the target rather than the proposal rectangle and
          ignore inner and neighboring objects.

          Return one {"type":"shape","parameters":{...}} object with shape_type and only its
          geometric fields. Polygon-like shapes use clockwise corners beginning at the visually
          top-left semantic corner. A sharp corner has type and point; a round corner has
          start/mid/end ordered along the clockwise boundary. Oval and other have no geometry.
          Callout includes body_type, body_corners or body_bbox, and tail.points ordered as
          attach_start, tip, attach_end. Card includes outer corners and ordered splits containing
          exactly two split_corners each, but no appearance fields.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Recover only the geometry of the target shape near
          {{ proposal_bbox_2d | json }}.

  - id: reconstruction
    sampling_weight: 4.0
    prompts:
      - id: detailed
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: |
          Reconstruct the complete visible outer shape near approximate proposal bbox
          {{ proposal_bbox_2d | json }}. Follow the target rather than the proposal rectangle and
          ignore inner and neighboring objects.

          Return one {"type":"shape","parameters":{...}} object using the complete v5.8 shape
          schema. Always include shape_type. For shape_type other, output only shape_type. Every
          other type includes border, fill, and effect. Polygon-like shapes include clockwise
          corners beginning at the visually top-left semantic corner. Callout additionally
          includes body_type, body_corners or body_bbox, and ordered tail.points. Card includes
          outer corners, ordered fill regions, and ordered splits with their border fields and two
          split_corners each. Preserve all conditional fields and output no target bbox.
      - id: concise
        sampling_weight: 1.0
        system_prompt: *banana_v5_8_system
        user_prompt_template: >-
          Fully reconstruct the target shape near {{ proposal_bbox_2d | json }}.
