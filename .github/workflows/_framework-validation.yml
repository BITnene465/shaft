name: framework-validation

"on":
  workflow_call:

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install quality environment
        run: uv sync --locked --extra dev

      - name: Run static checks
        run: |
          uv run --locked --no-sync ruff check src/shaft tests
          uv run --locked --no-sync python -m compileall -q src/shaft tests
          uv run --locked --no-sync python -c 'from pathlib import Path; import yaml; [yaml.safe_load(path.read_text()) for path in Path(".github/workflows").glob("*.yml")]'

      - name: Build wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

  cpu-tests:
    name: cpu-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - framework
          - smoke
          - task
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install test environment
        run: uv sync --locked --extra dev --extra train --extra rlhf

      - name: Run ${{ matrix.suite }} suite
        run: |
          mkdir -p "$RUNNER_TEMP/shaft-test-results"
          uv run --locked --no-sync pytest tests --suite "${{ matrix.suite }}" -ra \
            --junitxml="$RUNNER_TEMP/shaft-test-results/${{ matrix.suite }}.xml"

      - name: Upload ${{ matrix.suite }} results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpu-${{ matrix.suite }}-test-results
          path: ${{ runner.temp }}/shaft-test-results
          if-no-files-found: warn
          retention-days: 14

  distributed-tests:
    name: distributed-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: convergence-canary
            pytest_path: tests/test_smoke_distributed.py::test_training_contract_convergence_rejects_rank_drift_without_hanging
            suite: ""
            deselect: ""
          - shard: remainder
            pytest_path: tests
            suite: distributed
            deselect: tests/test_smoke_distributed.py::test_training_contract_convergence_rejects_rank_drift_without_hanging
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install distributed test environment
        run: uv sync --locked --extra dev --extra train --extra rlhf --extra distributed

      - name: Run ${{ matrix.shard }} distributed shard
        env:
          PYTEST_PATH: ${{ matrix.pytest_path }}
          PYTEST_SUITE: ${{ matrix.suite }}
          PYTEST_DESELECT: ${{ matrix.deselect }}
        run: |
          mkdir -p "$RUNNER_TEMP/shaft-test-results"
          if [ -n "$PYTEST_SUITE" ]; then
            pytest_args=("$PYTEST_PATH" --suite "$PYTEST_SUITE")
          else
            pytest_args=("$PYTEST_PATH")
          fi
          if [ -n "$PYTEST_DESELECT" ]; then
            pytest_args+=(--deselect "$PYTEST_DESELECT")
          fi
          uv run --locked --no-sync pytest "${pytest_args[@]}" -vv -ra \
            -o faulthandler_timeout=300 \
            --junitxml="$RUNNER_TEMP/shaft-test-results/distributed-${{ matrix.shard }}.xml"

      - name: Upload ${{ matrix.shard }} results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributed-${{ matrix.shard }}-test-results
          path: ${{ runner.temp }}/shaft-test-results
          if-no-files-found: warn
          retention-days: 14
