name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$package_version" >&2
            exit 1
          fi

  validation:
    name: validation
    needs:
      - metadata
    uses: ./.github/workflows/_framework-validation.yml

  package:
    name: package
    needs:
      - validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build source and wheel distributions
        run: uv build --sdist --wheel --out-dir dist

      - name: Verify wheel installs and imports
        run: |
          uv venv "$RUNNER_TEMP/release-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/python" -c 'import importlib.metadata, shaft; assert shaft.__version__ == importlib.metadata.version("shaft"); print(shaft.__file__)'

      - name: Generate package checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.whl > SHA256SUMS

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shaft-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: shaft-packages
          path: dist

      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Shaft $GITHUB_REF_NAME"
          fi
