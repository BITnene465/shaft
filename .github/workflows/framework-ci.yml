name: framework-ci

"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    uses: ./.github/workflows/_framework-validation.yml

  required:
    name: required
    if: always()
    needs:
      - validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Required job failed: validation=$VALIDATION_RESULT" >&2
            exit 1
          fi
          echo "All required framework validations passed."
